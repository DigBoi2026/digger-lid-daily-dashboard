# Saves the immutable history so the live routes don't re-pull two years of
# Shopify data on every cache miss — the thing that exhausts the rate-limit
# bucket. Once a day it pulls the full history, commits data/history/*.json, and
# the routes serve those snapshots with zero Shopify queries until the next run.
#
# A GitHub Action, not Vercel Cron: Cron on Hobby fires once a day and a bad
# `crons` block can take the site down, whereas this is isolated and emails the
# owner on failure.
#
# Setup is ONE repo secret (Settings → Secrets and variables → Actions →
# New repository secret):
#   SHOPIFY_CLIENT_SECRET   the shpss_… from Dev Dashboard → DASHBOARD CONNECT
# The store subdomain, client id and API version are non-secret and are set in
# plain text in the job below, so there is nothing else to add.
name: refresh-data

on:
  schedule:
    - cron: '20 18 * * *'      # 04:20 AEST daily, well clear of trading hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild snapshots
        env:
          # Store subdomain, client id and API version are non-secret (client id
          # is "public by design", per CREDENTIALS.md), so they live here in
          # plain sight. The ONLY secret the job needs is the client secret,
          # which mints a short-lived token via the client-credentials grant.
          SHOPIFY_STORE: digger-lid
          SHOPIFY_CLIENT_ID: '61976438e9a6e06e5b35a961eeb44619'
          SHOPIFY_API_VERSION: '2026-07'
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node source/build_history.js
      - name: Commit any changes
        run: |
          git config user.name "digboi-data-bot"
          git config user.email "bot@diggerlid.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore(data): refresh history snapshots"
            git push
          fi
