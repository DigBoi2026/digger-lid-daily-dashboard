# Keeps the board's fallback data honest. Two independent jobs, because they need
# different credentials and either is useful without the other:
#
#   snapshots  the committed fallbacks each page ships: data.js, region_data.js
#              and pulse_data.js. All three come from the DEPLOYED API, so the
#              only secret is DASHBOARD_PASSWORD — the site gate. This is the job
#              that fixes the real failure: source/build_region.js made no
#              network call at all, so region_data.js froze on 2026-07-02 and
#              stayed frozen for eighty-one days while every page rendered it as
#              current.
#
#              data.js joined this job late. It is the biggest snapshot on the
#              board and nothing automated refreshed it — `npm run snapshot` was
#              a command someone had to remember — so it drifted a month behind
#              the sheet. Its builder already merges rather than replaces (the
#              API returns four months; the board needs the year), and verifies
#              three known-good anchors before writing, so a bad parse fails
#              loudly instead of overwriting the year with nulls.
#
#   history    the immutable Shopify history the live routes serve instead of
#              re-pulling two years on every cache miss. Needs SHOPIFY_TOKEN.
#
# Each job SKIPS its BUILD cleanly when its secret is absent rather than erroring,
# so adding one secret gets you one working job instead of two broken ones.
#
# The FRESHNESS GATE runs either way, and that is deliberate. This workflow
# reported success nineteen times in a row while region_data.js sat ninety-six
# days out of date, because a run that does nothing exits 0. A green tick on a
# job whose entire purpose went unperformed is worse than no job at all. The
# gate asks the only question that matters — is the board's data actually fresh?
# — so the run is red whenever the answer is no, whatever the reason.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DASHBOARD_PASSWORD   the current SITE_PASSWORD        -> snapshots job
#   SHOPIFY_TOKEN        the shpat_... Admin API token    -> history job
name: refresh-data

on:
  schedule:
    - cron: '20 18 * * *'      # 04:20 AEST daily, well clear of trading hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  snapshots:
    name: Refresh committed snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # build_data.py is standard library only — no pip install step needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --no-annotate: this is the BEFORE picture, printed for the log. Only the
      # gate at the end annotates, or every stale file lands on the run summary
      # twice — which is how three problems showed up as eight errors.
      - name: Report freshness before
        run: node source/check_snapshots.js --no-annotate || true

      - name: Rebuild from the live API
        id: build
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
        run: |
          set -uo pipefail
          if [ -z "${DASHBOARD_PASSWORD:-}" ]; then
            echo "::warning title=snapshots skipped::DASHBOARD_PASSWORD is not set, so data.js, region_data.js and pulse_data.js cannot be refreshed. Add it under Settings -> Secrets and variables -> Actions."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Run each builder with its output CAPTURED, so a failure can be put
          # where someone will read it. Run 20 failed here and the only thing on
          # the summary was "Process completed with exit code 1" — the builder
          # had said exactly what was wrong, in a log you have to download to
          # see. A failure nobody can read is the same bug as a success nobody
          # can doubt.
          run_builder () {
            local label="$1"; shift
            local out rc
            out="$("$@" 2>&1)"; rc=$?
            printf '%s\n' "$out"
            if [ $rc -ne 0 ]; then
              {
                echo "### ❌ $label failed"
                echo ''
                echo '```'
                printf '%s\n' "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # One line, annotation-safe: %0A is how a newline survives.
              echo "::error title=$label failed::$(printf '%s' "$out" | tail -4 | sed 's/::/:/g' | paste -sd '|' -)"
              return 1
            fi
            return 0
          }

          fail=0
          run_builder "region + pulse snapshot" node source/build_snapshots.js || fail=1
          run_builder "data.js snapshot"        python3 source/build_data.py   || fail=1
          exit $fail

      - name: Commit any changes
        if: steps.build.outputs.skipped != 'true'
        run: |
          git config user.name "digboi-data-bot"
          git config user.email "bot@diggerlid.com"
          git add data.js region_data.js pulse_data.js
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore(data): refresh committed snapshots"
            git push
          fi

      # ALWAYS. Not "if the build ran" — a run that skipped its build and left
      # the board a month stale is exactly the run that must not report success.
      # --auto so the two snapshots nobody schedules (products_history,
      # meta_snapshot) are raised as warnings rather than failing a job that
      # could never have refreshed them.
      - name: Freshness gate
        if: always()
        run: node source/check_snapshots.js --auto

  history:
    name: Rebuild Shopify history cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild history
        id: hist
        env:
          # Store subdomain and API version are non-secret. The client-credentials
          # grant is NOT usable here: Shopify rejects it because the DASHBOARD
          # CONNECT app and the store are in different organisations (HTTP 400),
          # which is why a pre-minted token is the one that works.
          SHOPIFY_STORE: digger-lid
          SHOPIFY_API_VERSION: '2026-07'
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          if [ -z "${SHOPIFY_TOKEN:-}" ]; then
            echo "::notice title=history skipped::SHOPIFY_TOKEN is not set, so the history cache cannot be rebuilt."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node source/build_history.js
      - name: Commit any changes
        if: steps.hist.outputs.skipped != 'true'
        run: |
          git config user.name "digboi-data-bot"
          git config user.email "bot@diggerlid.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "chore(data): refresh history snapshots"
            git push
          fi
