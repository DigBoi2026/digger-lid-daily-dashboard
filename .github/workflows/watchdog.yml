# The fast half of the smoke alarm.
#
# Every 30 minutes it asks the board whether it is telling the truth, and fails
# the job when it is not.
#
# This is the ONLY schedule. Vercel Cron was the obvious place for it and is the
# wrong one twice over: on a Hobby plan it fires once a day, which is far too
# slow to catch a bad deploy — the last change that broke /api/data would have
# run most of a day before a daily check noticed — and a `crons` block in
# vercel.json is a deploy-time dependency on the account's plan, so getting it
# wrong takes the whole site down rather than just the alarm. An alarm must not
# be able to break the thing it is watching.
#
# It is a GitHub Action rather than another cron for one reason: it needs NO
# SETUP TO REACH A HUMAN. GitHub emails the repository owner when a scheduled
# workflow fails, by default. No webhook, no mail provider, no secret. It works
# the moment this file is merged.
#   To confirm: github.com/settings/notifications -> Actions -> "Notify for
#   failed workflows only" is the default. Add other people through the repo's
#   Watch -> Custom -> Actions.
#
# It also needs no credential. /api/watchdog is exempt from the Basic-Auth gate
# and returns status only, withholding every figure, unless a bearer token is
# presented. So there is nothing here to leak and nothing to rotate.
name: watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Is the board telling the truth?
        env:
          # Set the repository variable DASHBOARD_BASE_URL if the host changes.
          BASE: ${{ vars.DASHBOARD_BASE_URL || 'https://digboi-seven.vercel.app' }}
        run: |
          set -uo pipefail
          fail=0

          # The cache-buster matters: a cached 200 from an hour ago is exactly
          # the stale confidence this whole thing exists to catch.
          probe () {
            label="$1"; url="$2"
            out=$(curl -sS --max-time 45 -w '\n%{http_code}' "$url?t=$(date +%s)" 2>&1) || {
              echo "::error title=$label unreachable::curl failed: $out"
              return 1
            }
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | sed '$d')
            echo "--- $label -> HTTP $code"
            printf '%s\n' "$body" | head -c 4000
            echo
            if reason=$(printf '%s' "$body" | python3 .github/scripts/verdict.py "$label" "$code"); then
              return 0
            fi
            echo "::error title=$label::$reason"
            return 1
          }

          # The real data path, freshness, the pending tail and the forecast.
          probe watchdog "$BASE/api/watchdog" || fail=1

          # Integration reachability, which the watchdog deliberately does not
          # duplicate. /api/health always answers 200, so its BODY is the
          # verdict — which is why probe reads ok rather than the status.
          probe health "$BASE/api/health" || fail=1

          if [ "$fail" != "0" ]; then
            echo "The board is not telling the truth. See the annotations above."
            exit 1
          fi
          echo "Board healthy."

      # One row a day, so the forecast can be checked against what actually
      # happened rather than only in simulation. Optional on purpose: it needs a
      # credential for the figures, so without the secret it skips rather than
      # failing — the alarm above is the part that must never be blocked by
      # missing configuration.
      - name: Record what the forecast said
        if: github.event_name == 'schedule'
        env:
          BASE: ${{ vars.DASHBOARD_BASE_URL || 'https://digboi-seven.vercel.app' }}
          TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "No WATCHDOG_TOKEN secret set, so there is nothing to log with."
            echo "Add one (CRON_SECRET or an AI token from Vercel) under"
            echo "Settings -> Secrets and variables -> Actions to start the log."
            exit 0
          fi
          # Once a day, at whichever run lands in the 22:00 UTC hour.
          if [ "$(date -u +%H)" != "22" ]; then
            echo "Not the logging hour (UTC $(date -u +%H)); skipping."
            exit 0
          fi
          csv=$(curl -sS --max-time 45 -H "Authorization: Bearer $TOKEN" \
                  "$BASE/api/watchdog?format=csv&t=$(date +%s)") || {
            echo "::warning title=forecast log::could not fetch the row"; exit 0; }
          echo "$csv"
          echo "$csv" | tail -n +2 >> forecast_log.csv || true
          echo "::notice title=forecast logged::$(echo "$csv" | tail -n1)"
